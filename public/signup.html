<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Computer Tips & Tricks</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #2b9cd9; --primary-dark: #1e7eb3; --text-dark: #1f2937; --text-muted: #6b7280; --bg-offwhite: #f9fafb; --border-color: #e5e7eb; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background-color: var(--bg-offwhite); color: var(--text-dark); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 2rem; }
        .login-container { background: white; padding: 3rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        .logo-container { display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 800; font-size: 1.25rem; color: var(--text-dark); text-decoration: none; margin-bottom: 2rem; }
        .real-logo { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
        h2 { font-size: 1.75rem; font-weight: 700; margin-bottom: 0.5rem; }
        .subtitle { color: var(--text-muted); margin-bottom: 2rem; }
        .input-group { text-align: left; margin-bottom: 1.25rem; }
        .input-group label { display: block; font-weight: 600; font-size: 0.875rem; margin-bottom: 0.5rem; }
        .input-group input { width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--border-color); border-radius: 8px; font-size: 1rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s; }
        .input-group input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(43, 156, 217, 0.15); }
        .btn { width: 100%; padding: 0.875rem; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background-color 0.2s; margin-top: 0.5rem; }
        .btn:hover { background-color: var(--primary-dark); }
        .signup-link { margin-top: 2rem; font-size: 0.875rem; color: var(--text-muted); }
        .signup-link a { color: var(--primary); text-decoration: none; font-weight: 600; }
        .back-link { position: absolute; top: 2rem; left: 2rem; color: var(--text-muted); text-decoration: none; display: flex; align-items: center; gap: 0.5rem; font-weight: 500; }
        .back-link:hover { color: var(--text-dark); }
        .error-msg { background: #fef2f2; color: #dc2626; padding: 0.75rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
        .success-msg { background: #f0fdf4; color: #16a34a; padding: 0.75rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <a href="/" class="back-link"><i class="fa-solid fa-arrow-left"></i> Back to Home</a>
    <div class="login-container">
        <a href="/" class="logo-container">
            <img src="assets/logo.png" alt="Logo" class="real-logo">
            Computer Tips & Tricks
        </a>
        <h2>Create Your Account</h2>
        <p class="subtitle">Start learning computer skills today</p>
        <div class="error-msg" id="error-msg"></div>
        <div class="success-msg" id="success-msg"></div>
        <form id="signupForm">
            <div class="input-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Rahul Sharma" required>
            </div>
            <div class="input-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="you@example.com" required>
            </div>
            <div class="input-group">
                <label for="phone">Phone / WhatsApp (Optional)</label>
                <input type="tel" id="phone" placeholder="9876543210">
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Minimum 6 characters" required minlength="6">
            </div>
            <button type="submit" class="btn" id="signupBtn">Create Account</button>
        </form>
        <div class="signup-link">Already have an account? <a href="login.html">Log In</a></div>
    </div>
    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('signupBtn');
            const errEl = document.getElementById('error-msg');
            const successEl = document.getElementById('success-msg');
            btn.textContent = 'Creating account...';
            errEl.style.display = 'none';
            successEl.style.display = 'none';

            try {
                const res = await fetch('/api/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        name: document.getElementById('name').value,
                        email: document.getElementById('email').value,
                        phone: document.getElementById('phone').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await res.json();
                if (res.ok) {
                    successEl.textContent = 'Account created! Redirecting to dashboard...';
                    successEl.style.display = 'block';
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1500);
                } else {
                    errEl.textContent = data.error;
                    errEl.style.display = 'block';
                    btn.textContent = 'Create Account';
                }
            } catch (err) {
                errEl.textContent = 'Server not reachable. Make sure the backend is running.';
                errEl.style.display = 'block';
                btn.textContent = 'Create Account';
            }
        });
    </script>
</body>
</html>
